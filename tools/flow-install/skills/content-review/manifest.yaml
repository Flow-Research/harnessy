name: content-review
type: opencode
version: 0.1.1
install_scope: global
owner: julian
status: experimental
blast_radius: medium
description: "Reusable article and content review workflow for fact-checking, audience clarity, editorial quality, and strategy-profile alignment."
permissions: [read, write, network]
data_categories: [pii]
egress: [public-web]
invoke: "/content-review"
location: tools/flow-install/skills/content-review
autoresearch:
  enabled: true
  metric_layer: 1
  time_budget_seconds: 1200
  evaluation_window: 3
  constraints:
    max_regression_rate: 0.1
    max_human_intervention: 0.5
traces:
  enabled: true
  gates:
    quality:
      - factual_grounding_gate
      - audience_clarity_gate
      - terminology_accessibility_gate
      - numerical_clarity_gate
      - main_message_gate
      - strategy_alignment_gate
    human:
      - publication_approval
