name: service-deploy
type: opencode
version: 0.1.6
install_scope: global
owner: julian
status: experimental
blast_radius: high
description: "CI/profile-driven service deployment capability with Hostinger as the first provider adapter."
permissions: [read, write, execute, network]
data_categories: [credentials]
egress: [api.hostinger.com, github.com, api.github.com, registry.npmjs.org, proxy.golang.org, sum.golang.org]
invoke: "/service-deploy"
location: tools/flow-install/skills/service-deploy
autoresearch:
  enabled: true
  metric_layer: 1
  time_budget_seconds: 1800
  evaluation_window: 3
  constraints:
    max_regression_rate: 0.1
    max_human_intervention: 0.5
traces:
  enabled: true
  gates:
    quality: [profile_check, package_check, deploy_evidence_check]
    human: [local_override_approval, production_deploy_approval]
dependencies:
  - tool: python3
    description: "Python 3 for harness-deploy runtime"
    check: "python3 --version"
    required: true
  - tool: node
    description: "Node.js for Hostinger MCP tools when provider execution is enabled"
    check: "node --version"
    required: false
  - tool: hostinger-hosting-mcp
    description: "Scoped Hostinger MCP server for managed hosting/static/Node deployments"
    check: "command -v hostinger-hosting-mcp"
    auth_check: 'test -n "${HOSTINGER_API_TOKEN:-}"'
    required: false
    install:
      fallback: "npm install -g hostinger-api-mcp"
  - tool: hostinger-vps-mcp
    description: "Scoped Hostinger MCP server for VPS/Docker Compose deployments"
    check: "command -v hostinger-vps-mcp"
    auth_check: 'test -n "${HOSTINGER_API_TOKEN:-}"'
    required: false
    install:
      fallback: "npm install -g hostinger-api-mcp"
  - tool: hapi
    description: "Hostinger API CLI; mirrors Hostinger API endpoints"
    check: "command -v hapi"
    auth_check: 'test -n "${HAPI_API_TOKEN:-${HOSTINGER_API_TOKEN:-}}"'
    required: false
    install:
      darwin: 'mkdir -p "$HOME/.local/bin" && tmp="$(mktemp -d)" && git clone --depth 1 https://github.com/hostinger/api-cli "$tmp/api-cli" && (cd "$tmp/api-cli" && go build -o "$HOME/.local/bin/hapi")'
      linux: 'mkdir -p "$HOME/.local/bin" && tmp="$(mktemp -d)" && git clone --depth 1 https://github.com/hostinger/api-cli "$tmp/api-cli" && (cd "$tmp/api-cli" && go build -o "$HOME/.local/bin/hapi")'
  - tool: expect
    description: "Optional password bootstrap for installing SSH public keys when Hostinger key attachment is insufficient"
    check: "command -v expect"
    required: false
  - tool: ssh-keygen
    description: "Optional project-local deploy key generation for non-interactive VPS deployment"
    check: "command -v ssh-keygen"
    required: false
